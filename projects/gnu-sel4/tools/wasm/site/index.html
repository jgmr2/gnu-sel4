<!doctype html>
<!-- GNU/seL4 in the browser: the ARM64 build in QEMU compiled to WebAssembly (qemu-wasm).
     Everything runs in this page; nothing on a server. SPDX-License-Identifier: BSD-2-Clause -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>GNU/seL4 in the browser</title>
<link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css">
<style>
  body { margin: 0; background: #16181d; color: #d8dbe2; font: 14px system-ui, sans-serif; }
  header { padding: 8px 16px; background: #1f2229; }
  #terminal { padding: 8px 16px; }
  .note { color: #8b90a0; font-size: 12px; }
</style>
</head>
<body>
<header><b>GNU/seL4</b> — ARM64, emulated in your browser <span class="note">(booting takes a while: everything is emulated here)</span></header>
<div id="terminal"></div>
<script src="./load.js"></script>
<script type="module">
  import 'https://unpkg.com/xterm@5.3.0/lib/xterm.js';
  import 'https://unpkg.com/xterm-pty@0.9.4/index.js';
  import './module.js';
  import initEmscriptenModule from './qemu-system-aarch64.js';
  const xterm = new Terminal({ rows: 40, cols: 120 });
  xterm.open(document.getElementById('terminal'));
  const { master, slave } = openpty();
  xterm.loadAddon(master);
  Module.pty = slave;
  Module['mainScriptUrlOrBlob'] = new URL('./qemu-system-aarch64.js', location.href).href;
  (async () => {
    await initEmscriptenModule(Module);
    const oldPoll = Module['TTY'].stream_ops.poll, pty = Module['pty'];
    Module['TTY'].stream_ops.poll = function (stream, timeout) {
      if (!pty.readable) return (pty.readable ? 1 : 0) | (pty.writable ? 4 : 0);
      return oldPoll.call(stream, timeout);
    };
  })();
</script>
</body>
</html>
