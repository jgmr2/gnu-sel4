# GRUB menu of the live ISO (make PLATFORM=latitude7390 iso). Everything runs in RAM: the system
# has no disk driver, so the machine's disks are never touched.
#
# SPDX-License-Identifier: BSD-2-Clause
set timeout=5
set default=0
insmod all_video
insmod gfxterm
# The console draws on the firmware's framebuffer as it is: keep 1920x1080 (fbcon expects it)
set gfxmode=1920x1080x32,1920x1080,auto
set gfxpayload=keep
terminal_output gfxterm

menuentry "GNU/seL4 live: test battery, then a shell (RAM only)" {
    echo "Loading seL4 and the system into RAM..."
    multiboot2 /boot/sel4.elf
    module2 /boot/loader.img
    boot
}
# The same with the kernel's messages on COM1 (machines and VMs with a serial port: under UEFI
# seL4 cannot find the port in the BIOS data area by itself)
menuentry "GNU/seL4 live, kernel messages on COM1" {
    multiboot2 /boot/sel4.elf console_port=0x3f8 debug_port=0x3f8
    module2 /boot/loader.img
    boot
}
menuentry "Firmware settings / reboot" {
    reboot
}
