# Builds the development image (Dockerfile, stage "full": toolchain + every dependency from
# deps.lock + the patched Microkit tool + QEMU) and pushes it to Docker Hub.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME   your Docker Hub user
#   DOCKERHUB_TOKEN      a Docker Hub access token with read/write permission
# Image: jgmr2/gnu-sel4-dev (docker-compose.yml pulls it), tagged "latest" and with the commit.
#
# SPDX-License-Identifier: BSD-2-Clause
name: Docker image

on:
  push:
    branches: [main]
    paths:                       # only when what goes into the image changes
      - Dockerfile
      - .dockerignore
      - deps.lock
      - fetch-deps.sh
      - projects/gnu-sel4/microkit/*.patch
      - .github/workflows/docker-image.yml
  workflow_dispatch:             # and by hand, from the Actions tab

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          push: true
          tags: |
            jgmr2/gnu-sel4-dev:latest
            jgmr2/gnu-sel4-dev:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
